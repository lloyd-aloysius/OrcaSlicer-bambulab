name: Personal macOS arm64 build
on: workflow_dispatch
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja automake texinfo libtool gettext
      - name: Build dependencies and app
        run: |
          ./build_release_macos.sh -Pdx -a arm64 -t 13.0
          ./build_release_macos.sh -Psx -a arm64 -t 13.0
      - name: Slice without network access
        run: tests/macos/offline_slice.sh build/arm64/OrcaSlicer/OrcaSlicer.app build/verification
      - name: Exercise printer workflows
        run: |
          cmake -S . -B build/arm64 -DBUILD_TESTS=ON
          cmake --build build/arm64 --config Release --target native_printer_workflow
          ctest --test-dir build/arm64 -C Release -R '^native_printer_workflow$' --output-on-failure
      - name: Package the personal build
        run: scripts/package_macos_personal.sh build/arm64/OrcaSlicer/OrcaSlicer.app build/OrcaSlicer-Personal-arm64.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: OrcaSlicer-Personal-arm64
          path: build/OrcaSlicer-Personal-arm64.dmg
